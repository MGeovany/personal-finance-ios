name: Cero
options:
  bundleIdPrefix: com.mgeovany.cero
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Cero:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Sources/Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Cero
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The interface is a single white monochrome surface; a dark variant would
        # be a different design, not an inversion of this one.
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - Inter-Light.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - InterDisplay-Regular.ttf
          - InterDisplay-SemiBold.ttf
          - InterDisplay-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgeovany.cero

  CeroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CeroTests
    dependencies:
      - target: Cero
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgeovany.cero.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cero:
    build:
      targets:
        Cero: all
        CeroTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CeroTests
