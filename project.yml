name: Cero
options:
  bundleIdPrefix: com.mgeovany.cero
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Cero:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Sources/Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Cero
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The interface is a single white monochrome surface; a dark variant would
        # be a different design, not an inversion of this one.
        UIUserInterfaceStyle: Light
        # Every typeface the project carries ships, so `Typeface.active` is the only
        # thing that has to change to swap the app's type. Google Sans Flex arrives as
        # one file per weight; the other two are variable fonts whose weights are
        # named instances inside a single file.
        UIAppFonts:
          - GoogleSansFlex-Light.ttf
          - GoogleSansFlex-Regular.ttf
          - GoogleSansFlex-Medium.ttf
          - GoogleSansFlex-SemiBold.ttf
          - GoogleSansFlex-Bold.ttf
          - Quicksand-Variable.ttf
          - ElmsSans-Variable.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgeovany.cero

  CeroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CeroTests
    dependencies:
      - target: Cero
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgeovany.cero.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cero:
    build:
      targets:
        Cero: all
        CeroTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CeroTests
